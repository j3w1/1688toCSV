<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 320px;
                min-height: 180px;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(
                    306deg,
                    #ff7300 0%,
                    #ff2900 100% 100%
                );
                color: #333;
                padding: 20px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .container {
                background: white;
                border-radius: 16px;
                padding: 24px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                width: 100%;
                max-width: 280px;
                text-align: center;
            }

            .title {
                font-size: 18px;
                font-weight: 600;
                color: #2c3e50;
                margin-bottom: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .title-icon {
                width: 164px;
                height: 24px;
                /*background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);*/
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                color: white;
            }

            .title-icon img {
                width: 100%; /* or any custom size */
                height: 100%;
                max-height: 100%;
                max-width: 100%;
                object-fit: contain;
            }

            .status-container {
                margin-bottom: 20px;
                padding: 12px;
                border-radius: 8px;
                background: #f8f9fa;
                border: 1px solid #e9ecef;
            }

            .status-indicator {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-size: 14px;
                font-weight: 500;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                transition: all 0.3s ease;
            }

            .status-dot.loading {
                background: #ffc107;
                animation: pulse 1.5s infinite;
            }

            .status-dot.loaded {
                background: #28a745;
            }

            .status-dot.error {
                background: #dc3545;
            }

            @keyframes pulse {
                0% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.5;
                    transform: scale(1.2);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .download-button {
                background: linear-gradient(135deg, #ff7300 0%, #fe2900 100%);
                color: white;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                width: 100%;
                position: relative;
                overflow: hidden;
            }

            .download-button:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            }

            .download-button:active:not(:disabled) {
                transform: translateY(0);
            }

            .download-button:disabled {
                background: #6c757d;
                cursor: not-allowed;
                opacity: 0.6;
            }

            .button-text {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .loading-spinner {
                width: 16px;
                height: 16px;
                border: 2px solid transparent;
                border-top: 2px solid currentColor;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .error-message {
                color: #dc3545;
                font-size: 12px;
                margin-top: 8px;
                padding: 8px;
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                border-radius: 4px;
                display: none;
            }

            .success-message {
                color: #155724;
                font-size: 12px;
                margin-top: 8px;
                padding: 8px;
                background: #d4edda;
                border: 1px solid #c3e6cb;
                border-radius: 4px;
                display: none;
            }

            .page-info {
                font-size: 12px;
                color: #6c757d;
                margin-top: 12px;
                padding: 8px;
                background: #f8f9fa;
                border-radius: 4px;
                border: 1px solid #dee2e6;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="title">
                <div class="title-icon">
                    <img
                        src="https://img.alicdn.com/tfs/TB1FWIJcYj1gK0jSZFuXXcrHpXa-364-64.png"
                        alt="1688group"
                    />
                </div>
                1688 Order Exporter
            </div>

            <div class="status-container">
                <div class="status-indicator">
                    <div class="status-dot loading" id="status-dot"></div>
                    <span id="status-text">Checking page...</span>
                </div>
            </div>

            <button class="download-button" id="download-csv-order" disabled>
                <div class="button-text">
                    <div
                        class="loading-spinner"
                        id="button-spinner"
                        style="display: none"
                    ></div>
                    <span id="button-text">Download CSV</span>
                </div>
            </button>

            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
            <div class="page-info" id="page-info"></div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
