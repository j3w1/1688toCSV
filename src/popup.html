<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1688 · Order Exporter</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body data-state="loading">
    <main>
      <header>
        <div class="brand">
          <span class="brand-mark">1688</span><span>ORDER EXPORTER</span>
        </div>
        <span class="file-tag">.CSV</span>
      </header>
      <section class="intro">
        <p class="eyebrow">LESS COPYING. MORE CLARITY.</p>
        <h1>Your order.<br /><span>A clean sheet.</span></h1>
        <p class="subtitle">
          The details you need, ready for your spreadsheet.
        </p>
      </section>
      <section class="order-card" aria-label="Order details">
        <div class="status" role="status">
          <i aria-hidden="true"></i
          ><span id="status-text">Checking order…</span>
        </div>
        <div class="order-meta">
          <div>
            <span class="label">ORDER ID</span>
            <p id="order-id">Open an order to begin</p>
          </div>
          <div class="items">
            <span class="label">ITEMS</span>
            <p id="row-count">—</p>
          </div>
        </div>
      </section>
      <section class="includes" aria-label="CSV columns">
        <span class="label">IN YOUR EXPORT</span>
        <p>
          Image <b>·</b> Description <b>·</b> Price <b>·</b> Qty
          <b>·</b> Discount
        </p>
      </section>
      <button id="download-csv-order" class="download" disabled>
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5" />
        </svg>
        <span>Download CSV</span><span class="arrow" aria-hidden="true">↗</span>
      </button>
      <p id="feedback" role="status" aria-live="polite" hidden></p>
      <button id="retry" class="retry" hidden>Check page again</button>
      <footer>
        <span class="privacy-dot" aria-hidden="true"></span>Processed in your
        browser. No uploads.
      </footer>
    </main>
  </body>
</html>
