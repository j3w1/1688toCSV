<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>1688 CSV · Synthetic export</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7f7f2;
        color: #252820;
        font-family: 'Segoe UI', sans-serif;
        padding: 42px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 30px;
      }
      .mark {
        background: #ff5b20;
        color: white;
        border-radius: 10px;
        padding: 10px;
        font-weight: 700;
        font-size: 22px;
      }
      h1 {
        font-size: 23px;
        margin: 0 0 5px;
      }
      p {
        font-size: 12px;
        color: #66705b;
        margin: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        background: white;
        border: 1px solid #dfe3d7;
      }
      th {
        text-align: left;
        background: #eef1e7;
        font-size: 11px;
        letter-spacing: 0.6px;
        padding: 15px;
        color: #57604c;
      }
      td {
        border-top: 1px solid #e4e7dd;
        padding: 18px 15px;
        font-size: 13px;
        white-space: pre-line;
        line-height: 1.65;
      }
      td:nth-child(n + 3) {
        font-family: ui-monospace, monospace;
      }
      caption {
        caption-side: bottom;
        text-align: left;
        padding-top: 18px;
        font-size: 11px;
        color: #74806a;
      }
      .image {
        display: inline-block;
        width: 40px;
        height: 40px;
        background: #fff0e5;
        border-radius: 8px;
        text-align: center;
        font-size: 25px;
        line-height: 40px;
      }
    </style>
    <script type="module" src="export.js"></script>
  </head>
  <body>
    <header>
      <span class="mark">1688</span>
      <div>
        <h1>Your order, ready to work with.</h1>
        <p>示例工厂_6789.csv · 2 items · UTF-8</p>
      </div>
    </header>
    <table>
      <thead>
        <tr>
          <th>Thumbnail</th>
          <th>Description</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Discount</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
      <caption>
        Synthetic fixture data · Original unit prices and per-line discounts ·
        Spreadsheet-style preview of the CSV
      </caption>
    </table>
  </body>
</html>
